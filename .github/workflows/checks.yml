name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check publication contents
        run: python tools/check_publication.py
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Offline regression tests
        run: python -m pytest -q
      - name: Critical Python lint checks
        run: ruff check .
      - name: Known runtime dependency vulnerabilities
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
